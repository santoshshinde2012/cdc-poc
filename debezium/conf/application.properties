# Debezium Server: Postgres source -> HTTP sink (local stand-in for Zerobus Ingest).
# Property names follow the Debezium Server and Postgres connector reference docs (3.7).

# ---------- Sink ----------
debezium.sink.type=http
debezium.sink.http.url=http://host.docker.internal:18080/ingest
debezium.sink.http.timeout.ms=30000
debezium.sink.http.retries=30
debezium.sink.http.retry.interval.ms=1000
debezium.sink.http.batch.enabled=true
debezium.sink.http.batch.max-size=200

# ---------- Source ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=app
debezium.source.database.password=app
debezium.source.database.dbname=shop
debezium.source.topic.prefix=cdc
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=dbz_slot
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.customers,public.orders
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=string
debezium.source.heartbeat.interval.ms=5000
debezium.source.tombstones.on.delete=true

# Offsets on a mounted volume. Flushed every 20 s, so a hard kill can replay up to 20 s of events.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=20000

# ---------- Format ----------
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

quarkus.log.console.json=false
quarkus.log.level=INFO
