name: cdc-poc

services:
  postgres:
    # Pinned to a minor version and an image digest, so a fresh clone runs the same bits.
    image: postgres:17.12@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    container_name: cdc-poc-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=-1
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/workload.sql:/sql/workload.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m

  debezium:
    image: quay.io/debezium/server:3.7.1.Final@sha256:837b95b6e1db1210d6e943fd4d261e45d8536e6f0ab3999f6de5e4780341e5f8
    container_name: cdc-poc-debezium
    depends_on:
      postgres:
        condition: service_healthy
    # The receiver runs on the host (uv), reached through host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./debezium/conf:/debezium/config:ro
      - ./data/debezium:/debezium/data
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
    # Quarkus health endpoint: healthy only once the connector is running. `up --wait` blocks on this.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    # On stop Debezium flushes its offsets and closes the replication connection. Give it time.
    stop_grace_period: 30s
    mem_limit: 768m

volumes:
  pgdata:
