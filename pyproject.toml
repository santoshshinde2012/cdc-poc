[project]
name = "cdc-poc"
version = "0.2.0"
description = "Local proof of concept: push-based Postgres CDC into Delta without a Kafka broker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deltalake>=1.1",
    "polars>=1.20",
    "pyarrow>=18",
]

[project.scripts]
cdc-receiver = "cdc_poc.ingest.app:main"
cdc-silver = "cdc_poc.silver.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_poc"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: end-to-end tests that need Docker (Postgres + Debezium)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN", "PT", "RET", "C4", "PL"]
ignore = ["PLR2004", "PLR0913", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
